[package]
name = "mailcraft-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "axum HTTP API server"

[dependencies]
mailcraft-core.workspace = true
mailcraft-engine.workspace = true
mailcraft-deliverability = { path = "../mailcraft-deliverability" }
mailcraft-automations = { path = "../mailcraft-automations" }
mailcraft-templates.workspace = true
mailcraft-transport.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
prometheus = { version = "0.13", default-features = false }
base64 = "0.22"
futures-lite = "2"

[dev-dependencies]
tower.workspace = true
http-body-util = "0.1"
tokio = { workspace = true, features = ["io-util"] }

[[bin]]
name = "mailcraft-server"
path = "src/main.rs"
