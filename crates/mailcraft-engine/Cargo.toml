[package]
name = "mailcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Queue worker: claim, send, retry (Postgres SKIP LOCKED)"

[dependencies]
mailcraft-core.workspace = true
mailcraft-transport.workspace = true
mailcraft-templates.workspace = true
async-trait.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
serde_json.workspace = true
mail-builder = "2"
rand = "0.8"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread"] }
