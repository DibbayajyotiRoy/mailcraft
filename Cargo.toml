[workspace]
resolver = "2"
members = [
  "crates/mailcraft-core",
  "crates/mailcraft-api",
  "crates/mailcraft-engine",
  "crates/mailcraft-transport",
  "crates/mailcraft-llm",
  "crates/mailcraft-templates",
  "crates/mailcraft-cli",
  "crates/mailcraft-deliverability",
  "crates/mailcraft-automations",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/DibbayajyotiRoy/mailcraft"
authors = ["mailcraft contributors"]

[workspace.dependencies]
mailcraft-core = { path = "crates/mailcraft-core" }
mailcraft-transport = { path = "crates/mailcraft-transport" }
mailcraft-llm = { path = "crates/mailcraft-llm" }
mailcraft-templates = { path = "crates/mailcraft-templates" }
mailcraft-engine = { path = "crates/mailcraft-engine" }
mailcraft-api = { path = "crates/mailcraft-api" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
mrml = "6"
minijinja = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
