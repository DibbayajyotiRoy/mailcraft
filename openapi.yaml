openapi: 3.1.0
info:
  title: mailcraft API
  version: 0.0.1
  description: |
    Single source of truth for the REST API, the CLI and the MCP tools (SPEC.md section 7).
    Every success body is `{ok:true, data, request_id}` (lists add `next_cursor`); every failure
    is `{ok:false, error:{code,message,field?,hint?,doc_url,retryable}, request_id}`.
    Mutating routes accept `Idempotency-Key` (24 h replay window, `Idempotent-Replay: true`).
  license: { name: AGPL-3.0-only, url: https://www.gnu.org/licenses/agpl-3.0.html }
servers:
  - url: http://localhost:8080
security:
  - bearer: []
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Liveness only (says nothing about Postgres or Redis)
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
  /readyz:
    get:
      operationId: readyz
      security: []
      summary: Readiness. Fails on Postgres / migrations; Redis is reported as a warning only.
      responses:
        "200": { description: ready }
        "503": { description: not ready }
  /metrics:
    get:
      operationId: metrics
      security: []
      summary: Prometheus metrics (Bearer MAILCRAFT_METRICS_TOKEN when configured)
      responses:
        "200": { description: text exposition format }
  /openapi.yaml:
    get:
      operationId: openapi
      security: []
      summary: This document
      responses:
        "200": { description: yaml }

  /v1/emails:
    post:
      operationId: emails_send
      summary: Send one email (enqueue). Test keys sandbox it. Supports dry_run and Idempotency-Key.
      description: |
        One `emails` row is queued per recipient. `data.status` is `queued` or `pending_approval`
        (202, with `approval_id`; poll GET /v1/approvals/{id}, never decide). A `blocked` policy is
        403 `blocked_by_policy`. `dry_run: true` stores nothing and returns 200 with `rendered`, `lint`, `would_send_via`.
        Scope: send.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SendEmail" } } } }
      responses:
        "200": { description: dry run preview }
        "202": { description: queued or pending_approval, content: { application/json: { schema: { $ref: "#/components/schemas/SendResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      operationId: emails_list
      summary: List emails, newest first (scope read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: stream, in: query, schema: { type: string, enum: [transactional, marketing] } }
        - { name: env, in: query, schema: { type: string, enum: [test, live] } }
        - { name: q, in: query, description: "Case-insensitive substring of to / from / subject, or an exact email id", schema: { type: string } }
        - { name: from, in: query, description: "created_at >= (YYYY-MM-DD or RFC 3339)", schema: { type: string } }
        - { name: to, in: query, description: "created_at <= (RFC 3339), or the end of that day (YYYY-MM-DD)", schema: { type: string } }
      responses:
        "200": { description: page of emails }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/emails/batch:
    post:
      operationId: emails_batch_send
      summary: Send up to 100 emails. Response `data[]` is index-aligned with per-item `{ok,data|error}`. No dry_run.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/SendEmail" } }
      responses:
        "202": { description: per-item results }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/emails/{id}:
    get:
      operationId: email_get
      summary: Email status and stored body (scope read)
      description: |
        Adds `html` and `text` (the body as sent, or as rendered by the worker for template mail; each
        capped at 200000 characters, `body_truncated` says when cut). Both are null until a body exists
        (a template email is rendered at send time). `html` is untrusted: show it in a sandboxed iframe.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: email }
        "404": { $ref: "#/components/responses/Error" }
  /v1/emails/{id}/cancel:
    post:
      operationId: email_cancel
      summary: Cancel a queued, deferred or pending_approval email (scope send)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: cancelled }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/emails/{id}/events:
    get:
      operationId: email_events
      summary: Event timeline for one email (scope read)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: events }

  /v1/broadcasts:
    post:
      operationId: broadcast_create
      summary: Send one template to a list of recipients (scope send). Supports dry_run and Idempotency-Key.
      description: |
        Each recipient becomes one queued email, so the kill switch, suppression, key caps, approvals,
        test/live rules and unsubscribe links apply as for POST /v1/emails. Contacts are upserted.
        Rows that cannot be sent are returned in `skipped` with a `reason`: `invalid_email`, `duplicate`
        (case-insensitive), `invalid_data`, `suppressed`, `unsubscribed`, `not_allowed` (test key / allowlist),
        `missing_variable` (the template needs a value the row lacks; `detail` says which). Up to 5000 rows.
        Template variables per recipient: `first_name`, `last_name`, `email`, `data.<column>`; blank values are
        left out so `{{ first_name | default("there") }}` applies. A `subject` override may use them too.
        Pacing: with a daily cap (default transport `daily_cap`, key `daily_send_cap` or `max_per_day`, the
        lowest) rows are scheduled evenly across the day, queued behind earlier broadcasts; see `schedule`.
        `dry_run: true` stores nothing and returns 200 with `queued`, `skipped`, `schedule`.
        A `needs_approval` policy yields 202 `pending_approval` with one `approval_id` covering every row.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateBroadcast" } } } }
      responses:
        "200": { description: dry run, content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastResult" } } } }
        "202": { description: queued or pending_approval, content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      operationId: broadcast_list
      summary: List broadcasts with per-status counts, newest first (scope read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: page of broadcasts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Broadcast" } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/broadcasts/preview:
    post:
      operationId: broadcast_preview
      summary: Render the template for one recipient exactly as it would be sent; nothing is stored (scope read)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id, recipient]
              additionalProperties: false
              properties:
                template_id: { type: string, description: id or alias }
                subject: { type: string }
                stream: { type: string, enum: [transactional, marketing], default: marketing }
                recipient: { $ref: "#/components/schemas/BroadcastRecipient" }
      responses:
        "200": { description: rendered, content: { application/json: { schema: { type: object, properties: { subject: { type: string }, html: { type: string }, text: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/broadcasts/{id}:
    get:
      operationId: broadcast_get
      summary: One broadcast with counts and its recipients' status, paginated by email id (scope read)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, description: "`next_cursor` of the previous page", schema: { type: string, format: uuid } }
        - { name: status, in: query, description: only recipients with this email status, schema: { type: string } }
      responses:
        "200": { description: broadcast, content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/senders:
    get:
      operationId: sender_list
      summary: The From addresses you can pick, derived from what is connected (scope read)
      description: |
        Every mailbox relay's login and aliases, plus the workspace `default_from` when it is not one of them.
        Read-only: add or change addresses on the transport (`POST` / `PATCH /v1/transports`). `status`: `ready`
        (the address's mailbox relay or verified domain covers it), `needs_domain` (add and verify its domain),
        `transport_missing` (no transport to send through). `transport` is where a send from this address goes,
        by the routing order in `POST /v1/emails`.
      responses:
        "200": { description: senders, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Sender" } } } } } } }
  /v1/keys:
    post:
      operationId: api_key_create
      summary: Create a key (scope admin). The secret is returned once. Keys made here never hold `admin`.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateKey" } } } }
      responses:
        "201": { description: created, includes `token` }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      operationId: api_key_list
      summary: List keys (scope admin); never returns secrets. `last_used_at` is stamped at most once a minute per key.
      responses:
        "200": { description: keys }
  /v1/keys/{id}:
    get:
      operationId: api_key_get
      summary: Get a key (scope admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: key }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: api_key_update
      summary: Change a key's policy, allowlist or caps (scope admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: { $ref: "#/components/schemas/KeyPolicy" }
                recipient_allowlist: { type: array, items: { type: string } }
                daily_send_cap: { type: integer, minimum: 1 }
                minute_send_cap: { type: integer, minimum: 1 }
      responses:
        "200": { description: key }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: api_key_revoke
      summary: Revoke a key (scope admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: revoked }
        "404": { $ref: "#/components/responses/Error" }

  /v1/domains:
    post:
      operationId: domain_add
      summary: Add a sending domain; returns DNS records (scope manage; DomainService)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                stream: { type: string, enum: [transactional, marketing] }
                tracking: { type: object, properties: { clicks: { type: boolean }, opens: { type: boolean } } }
      responses:
        "201": { description: created }
        "501": { $ref: "#/components/responses/Error" }
    get:
      operationId: domain_list
      summary: List domains (scope read)
      responses:
        "200": { description: domains }
        "501": { $ref: "#/components/responses/Error" }
  /v1/domains/{id}:
    get:
      operationId: domain_get
      summary: Get a domain with record status (scope read)
      description: |
        Besides the DNS records: `transport_id` (the transport sends from this domain use, `null` = the workspace
        default) and, when a mailbox relay logs in or sends as an address on this domain, `relay_senders` (those
        addresses; `relay_sender` is the first). Sends from those addresses need no domain records.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: domain }
        "501": { $ref: "#/components/responses/Error" }
    patch:
      operationId: domain_patch
      summary: Bind a domain to a transport (scope manage)
      description: "`{transport_id}`: sends from this domain go through that transport; `null` unbinds it (the workspace default is used)."
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { transport_id: { type: [string, "null"], format: uuid } } } } } }
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: the domain }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: domain_delete
      summary: Delete a domain (scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: deleted }
        "501": { $ref: "#/components/responses/Error" }
  /v1/domains/{id}/verify:
    post:
      operationId: domain_verify
      summary: Re-check DNS now (scope manage)
      description: |
        Sets `last_checked_at`. Each record carries `checked_at`, `detail` (why it is not verified) and,
        when the record is wrong, `found` (what DNS returned at that name).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: domain with updated records }
        "501": { $ref: "#/components/responses/Error" }
  /v1/domains/{id}/rotate-dkim:
    post:
      operationId: domain_rotate_dkim
      summary: Rotate the DKIM selector (scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: domain }
        "501": { $ref: "#/components/responses/Error" }

  /v1/contacts:
    put:
      operationId: contact_upsert
      summary: Upsert a contact (scope manage; ContactService)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                first_name: { type: string }
                last_name: { type: string }
                timezone: { type: string }
                properties: { type: object }
      responses:
        "200": { description: contact }
        "501": { $ref: "#/components/responses/Error" }
    get:
      operationId: contact_list
      summary: List contacts (scope manage). Each item carries `suppressed` and `suppression_reason`.
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: q, in: query, description: "Case-insensitive substring of email, first or last name", schema: { type: string } }
      responses:
        "200": { description: page of contacts }
        "501": { $ref: "#/components/responses/Error" }
  /v1/contacts/import:
    post:
      operationId: contact_import
      summary: Upsert up to 5000 contacts in one call (scope manage)
      description: |
        Same semantics as `PUT /v1/contacts` per row. A bad row (invalid email or timezone) is skipped and
        reported in `failed` with its zero-based `index`; the rest are imported. Idempotent by `Idempotency-Key`.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                contacts:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [email]
                    properties:
                      email: { type: string, format: email }
                      first_name: { type: string }
                      last_name: { type: string }
                      timezone: { type: string }
                      properties: { type: object }
      responses:
        "200": { description: "`{imported, failed: [{index, email, error: {code, message}}]}`" }
        "400": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v1/contacts/{id}:
    get:
      operationId: contact_get
      summary: Get a contact by id or email (scope manage). Includes `suppressed` and `suppression_reason`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: contact }
        "501": { $ref: "#/components/responses/Error" }
    patch:
      operationId: contact_patch
      summary: Edit a contact by id or email (scope manage)
      description: |
        Omitted fields stay. `""` clears `first_name`, `last_name` or `timezone`. `properties` is merged
        shallowly and a `null` value deletes that key. Audited as `contact.update` (field names only).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                timezone: { type: string, description: IANA name, e.g. Europe/Berlin }
                properties: { type: object }
      responses:
        "200": { description: contact }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    delete:
      operationId: contact_delete
      summary: Delete a contact (suppression records are kept)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: deleted }
        "501": { $ref: "#/components/responses/Error" }
  /v1/contacts/{id}/activity:
    get:
      operationId: contact_activity
      summary: Recent activity of one contact (scope manage)
      description: |
        `{events, emails, runs, topics, segments}`, newest first, at most 25 each. `events` are tracked events,
        `emails` everything sent to the address, `runs` automation runs, `topics` per-topic opt-in state and
        `segments` the segments the contact is in.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: activity }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v1/contacts/{id}/suppress:
    post:
      operationId: contact_suppress
      summary: Suppress a contact (scope manage). Undo with `DELETE /v1/suppressions/{email}`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses:
        "200": { description: suppressed }
        "501": { $ref: "#/components/responses/Error" }
  /v1/segments:
    post:
      operationId: segment_create
      summary: Create a segment (scope manage; SegmentService)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, filter: { type: object } } } } }
      responses:
        "201": { description: segment }
        "501": { $ref: "#/components/responses/Error" }
    get:
      operationId: segment_list
      summary: List segments with `member_count` (scope manage)
      description: For a segment with a `filter`, `member_count` is who matches right now; a manual list reports its stored members.
      responses:
        "200": { description: segments }
        "501": { $ref: "#/components/responses/Error" }
  /v1/segments/preview:
    post:
      operationId: segment_preview
      summary: Who a filter matches right now (scope manage); stores nothing
      description: |
        Returns `{count, sample: [{email, first_name, last_name}]}` (5 newest matches). The filter is a rule tree:
        `{"and":[..]}`, `{"or":[..]}`, `{"not":..}` or `{"field","op","value"}` with op one of
        `eq neq lt lte gt gte in contains exists`. Fields: `email`, `first_name`, `last_name`, `timezone`,
        `created_at`, `properties.<key>`, `topic:<key>` (opted in), `event_count:<event>` and
        `days_since:<event>` (whole days since the contact last tracked it; absent if never).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [filter], properties: { filter: { type: object } } } } }
      responses:
        "200": { description: count and sample }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/segments/{id}:
    put:
      operationId: segment_update
      summary: Replace a segment's name and filter (scope manage)
      description: Full replace. Omit `filter` (or send null) to make it a manual list. 409 when another segment has the name.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, filter: { type: object, nullable: true } } } } }
      responses:
        "200": { description: segment }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    delete:
      operationId: segment_delete
      summary: Delete a segment (scope manage)
      description: 409 `invalid_state` while an automation still names the segment in a trigger or `add_to_segment` step.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v1/segments/{id}/members:
    post:
      operationId: segment_add_members
      summary: Add contacts (by email) to a segment (scope manage)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [emails], properties: { emails: { type: array, items: { type: string }, maxItems: 1000 } } } } }
      responses:
        "200": { description: result }
        "501": { $ref: "#/components/responses/Error" }
  /v1/events:
    post:
      operationId: event_send
      summary: Track an event (scope send or manage; EventService). Deduped by Idempotency-Key.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, contact]
              properties:
                name: { type: string }
                contact: { type: object, required: [email], properties: { email: { type: string } } }
                properties: { type: object }
                contact_properties: { type: object }
                dry_run: { type: boolean }
      responses:
        "200": { description: dry run result }
        "202": { description: accepted }
        "501": { $ref: "#/components/responses/Error" }

  /v1/approvals:
    get:
      operationId: approval_list
      summary: List approvals (scope read)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, expired] } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: approvals }
  /v1/approvals/{id}:
    get:
      operationId: approval_get
      summary: One approval with preview payload (scope read). Agents poll this.
      description: |
        For email approvals `payload.preview.html` / `text_full` hold the stored body of the first gated
        email when one exists (capped at 200000 characters). Untrusted: render in a sandboxed iframe.
        `reason` is the decider's note.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: approval }
        "404": { $ref: "#/components/responses/Error" }
  /v1/approvals/{id}/decide:
    post:
      operationId: approval_decide
      summary: Approve or reject (scope admin; never granted to agent keys, deliberately absent from MCP)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approve, reject] }, reason: { type: string, maxLength: 500 } } } } }
      responses:
        "200": { description: decided }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/go-live-requests:
    post:
      operationId: go_live_request
      summary: Ask a human to enable live sending (scope manage). Creates a `go_live` approval.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        "202": { description: pending approval }
  /v1/policy/proposals:
    post:
      operationId: policy_propose
      summary: Propose a key policy change; a human approves it (scope manage)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [key_id, policy], properties: { key_id: { type: string, format: uuid }, policy: { $ref: "#/components/schemas/KeyPolicy" } } } } }
      responses:
        "202": { description: pending approval }
  /v1/kill-switch:
    get:
      operationId: kill_switch_status
      summary: Workspace switch and paused keys (scope read)
      responses:
        "200": { description: status }
    post:
      operationId: kill_switch_set
      summary: Engage (scope manage or admin) or disengage (scope admin only). Omit key_id for the whole workspace.
      description: Checked at API admission and at dequeue by the worker, so already-queued mail stops.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [on], properties: { on: { type: boolean }, key_id: { type: string, format: uuid } } } } }
      responses:
        "200": { description: state }
        "403": { $ref: "#/components/responses/Error" }
  /v1/audit:
    get:
      operationId: audit_list
      summary: Audit log, newest first (scope read). Args are redacted.
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: before, in: query, schema: { type: integer }, description: "id cursor" }
      responses:
        "200": { description: rows }
  /v1/audit/verify:
    get:
      operationId: audit_verify
      summary: Recompute the hash chain (scope admin). `ok:false` names the first bad row.
      responses:
        "200": { description: "{ok, checked, first_bad_id}" }
  /v1/account/status:
    get:
      operationId: account_status
      summary: Workspace flags, pending approvals and the calling key (scope read)
      responses:
        "200": { description: status }

  /v1/webhooks:
    post:
      operationId: webhook_create
      summary: Create an endpoint (scope manage). The `whsec_` secret is returned once. URL passes an SSRF guard.
      description: |
        Deliveries are signed per Standard Webhooks (`webhook-id`, `webhook-timestamp`, `webhook-signature: v1,<b64 hmac-sha256>`
        over `id.timestamp.body`) with `svix-*` twins. Retries: immediately, 5s, 5m, 30m, 2h, 5h, 10h, 10h (8 attempts, +/-10% jitter)
        on 5xx/408/429/network; other 4xx is final. 5 consecutive exhausted deliveries disable the endpoint.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                events: { type: array, items: { type: string }, default: ["*"] }
                description: { type: string }
      responses:
        "201": { description: created, includes `secret` }
        "400": { $ref: "#/components/responses/Error" }
    get:
      operationId: webhook_list
      summary: List endpoints (scope manage); never returns secrets
      responses:
        "200": { description: endpoints }
  /v1/webhooks/{id}:
    delete:
      operationId: webhook_delete
      summary: Delete an endpoint (scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/webhooks/{id}/test:
    post:
      operationId: webhook_test
      summary: Queue a `test.ping` delivery (scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "202": { description: queued }
  /v1/webhooks/{id}/deliveries:
    get:
      operationId: webhook_deliveries
      summary: Recent deliveries for an endpoint (scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: deliveries }
  /v1/webhook-deliveries/{id}/replay:
    post:
      operationId: webhook_delivery_replay
      summary: Re-queue a delivery (scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "202": { description: queued }

  /u/{token}:
    get:
      operationId: unsubscribe_confirm
      security: []
      summary: Confirm page for a signed unsubscribe link. State-neutral (link scanners cannot unsubscribe anyone).
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: html confirm form }
        "400": { description: invalid link }
        "410": { description: expired link }
    post:
      operationId: unsubscribe_one_click
      security: []
      summary: RFC 8058 one-click unsubscribe. Body must carry `List-Unsubscribe=One-Click`. 200, never a redirect; idempotent.
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/x-www-form-urlencoded: { schema: { type: string } } } }
      responses:
        "200": { description: unsubscribed from the token's category }
        "400": { description: invalid link or missing one-click marker }
        "410": { description: expired link }
  /ingest/raw:
    post:
      operationId: ingest_raw
      security: []
      summary: Ingest one raw RFC 822 bounce (DSN) or feedback-loop (ARF) report.
      description: |
        Authenticated by `MAILCRAFT_INGEST_TOKEN` (`Authorization: Bearer` or `?token=`), not an API key.
        The report is mapped to an email only through a MAC-verified VERP address inside it; anything
        else is ignored (`outcome: null`). Records a `bounced` / `complained` event and applies the
        suppression policy. Idempotent per email.
      requestBody: { required: true, content: { message/rfc822: { schema: { type: string, format: binary } } } }
      responses:
        "200": { description: "`data.outcome` is null when nothing was recorded" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { description: ingest token not configured }
  /ingest/ses:
    post:
      operationId: ingest_ses
      security: []
      summary: Amazon SES bounce and complaint notifications via SNS (HTTPS subscription).
      description: |
        Subscribe the SNS topic to `https://<host>/ingest/ses?token=<MAILCRAFT_INGEST_TOKEN>`. The
        `TopicArn` must be listed in `MAILCRAFT_SES_TOPIC_ARNS`. Handles `SubscriptionConfirmation`
        (confirms against an https `sns.*.amazonaws.com` URL only) and `Notification`
        (Bounce / Complaint; matched to the email by SES message id).
      requestBody: { required: true, content: { text/plain: { schema: { type: string } } } }
      responses:
        "200": { description: processed, ignored or confirmed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { description: ingest token not configured }
  /v1/setup:
    post:
      operationId: setup
      security: []
      summary: First-run setup. Unauthenticated; works only while no API key exists (409 `invalid_state` after). Secrets are shown once.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetupRequest" } } } }
      responses:
        "201": { description: keys created, content: { application/json: { schema: { $ref: "#/components/schemas/SetupResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/doctor:
    get:
      operationId: doctor
      summary: Server-side health checks (scope read). The CLI adds local probes (port 25, FCrDNS, blocklists).
      responses:
        "200": { description: checks, content: { application/json: { schema: { $ref: "#/components/schemas/DoctorResult" } } } }
  /v1/stats/overview:
    get:
      operationId: stats_overview
      summary: Event totals and a per-day series from email_events (scope read)
      parameters: [{ name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 7 } }]
      responses:
        "200": { description: stats, content: { application/json: { schema: { $ref: "#/components/schemas/StatsOverview" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/settings:
    get:
      operationId: settings_get
      summary: Workspace settings; secrets are write-only (scope read)
      responses:
        "200": { description: settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    put:
      operationId: settings_put
      summary: Partial update; an empty string clears a field (scope admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SettingsUpdate" } } } }
      responses:
        "200": { description: settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/policy:
    get:
      operationId: policy_get
      summary: Workspace default send policy and each active key's policy (scope read)
      responses:
        "200": { description: policy, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyView" } } } }
    put:
      operationId: policy_put
      summary: Set the workspace default policy (scope admin). Agents use POST /v1/policy/proposals.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [default], properties: { default: { $ref: "#/components/schemas/KeyPolicy" } } } } } }
      responses:
        "200": { description: saved }
        "400": { $ref: "#/components/responses/Error" }
  /v1/event-definitions:
    post:
      operationId: event_definition_create
      summary: Declare (or update) an event name and optional JSON schema (scope manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EventDefinition" } } } }
      responses:
        "201": { description: saved, content: { application/json: { schema: { $ref: "#/components/schemas/EventDefinition" } } } }
    get:
      operationId: event_definition_list
      summary: List declared events (scope manage)
      responses:
        "200": { description: definitions }
  /v1/suppressions:
    get:
      operationId: suppression_list
      summary: Suppressed addresses, newest first (scope read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: reason, in: query, schema: { type: string, enum: [hard_bounce, soft_bounce_limit, complaint, unsubscribe, manual, spam_trap] } }
      responses:
        "200": { description: page of suppressions }
  /v1/suppressions/{id}:
    delete:
      operationId: suppression_delete
      summary: Remove a suppression; `id` is the URL-encoded email address (scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/transports:
    post:
      operationId: transport_create
      summary: Add an smtp-relay (with `preset`) or ses transport (scope manage). Secrets are write-only.
      description: |
        `smtp-relay` config: `{host,port,tls?,username?,password,mailbox_sender?,aliases?,display_names?}` or, with `preset` (postmark, mailgun, resend, brevo, smtp2go, ses),
        `{username?,password,region?}`. `ses` config: `{region,access_key_id,secret_access_key,session_token?}`.
        `mailbox_sender: true` (needs `username`) sends with the mailbox address as the envelope sender, for
        mailbox relays such as Zoho, Gmail/Workspace or Outlook that refuse any other MAIL FROM; bounces then go to
        that mailbox. With it, `aliases` (plain addresses the mailbox may send as) and `display_names`
        (`{address: name}`) make those addresses From options: see `GET /v1/senders`. Gmail is connected with
        `/v1/transports/gmail/oauth/*`.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTransport" } } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Transport" } } } }
        "400": { $ref: "#/components/responses/Error" }
    get:
      operationId: transport_list
      summary: List transports (scope manage)
      responses:
        "200": { description: transports }
  /v1/transports/{id}:
    patch:
      operationId: transport_patch
      summary: Edit a mailbox relay's aliases and display names (scope manage)
      description: |
        `aliases`: the other addresses the mailbox sends as (the provider's "send mail as"); `display_names`:
        `{address: name}` for the login and each alias. A field you send replaces the stored one.
        400 unless the transport is an `smtp-relay` with `mailbox_sender`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { aliases: { type: array, items: { type: string } }, display_names: { type: object, additionalProperties: { type: string } } } } } } }
      responses:
        "200": { description: the stored aliases and display names, content: { application/json: { schema: { type: object, properties: { id: { type: string }, aliases: { type: array, items: { type: string } }, display_names: { type: object } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: transport_delete
      summary: Delete a transport that has sent nothing (409 `transport_in_use` otherwise; scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/transports/{id}/test:
    post:
      operationId: transport_test
      summary: Reachability / credential check (scope manage). Always 200; `ok:false` carries the reason.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: result, content: { application/json: { schema: { type: object, properties: { id: { type: string }, kind: { type: string }, ok: { type: boolean }, detail: { type: string } } } } } }
  /v1/transports/gmail/oauth/start:
    post:
      operationId: transport_gmail_oauth_start
      summary: Begin the Gmail OAuth flow (PKCE; scope manage). 501 `oauth_not_configured` without MAILCRAFT_GOOGLE_CLIENT_ID.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [redirect_uri], properties: { redirect_uri: { type: string }, login_hint: { type: string } } } } } }
      responses:
        "200": { description: consent URL, content: { application/json: { schema: { type: object, properties: { auth_url: { type: string }, state: { type: string } } } } } }
  /v1/transports/gmail/oauth/complete:
    post:
      operationId: transport_gmail_oauth_complete
      summary: Exchange the authorization code and store the encrypted refresh token (scope manage)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [state, code, redirect_uri], properties: { state: { type: string }, code: { type: string }, redirect_uri: { type: string } } } } } }
      responses:
        "200": { description: transport, content: { application/json: { schema: { $ref: "#/components/schemas/Transport" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/templates:
    post:
      operationId: template_create
      summary: Create a template with a draft v1 (scope manage). Give `html`, `mjml` or `content` (+`format`, default json).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTemplate" } } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: template_list
      summary: List templates, newest first (scope read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: page of templates }
  /v1/templates/import:
    post:
      operationId: template_import
      summary: Import html, mjml or canonical json as a new template (scope manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ImportTemplate" } } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } } }
  /v1/templates/{id}:
    get:
      operationId: template_get
      summary: Newest version with its canonical block tree; `id` is a uuid or alias (scope read)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: template }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: template_update
      summary: Rename, change alias or stream, and/or add a new draft version (scope manage)
      description: Each call with content adds a version. For `html` / `mjml`, `subject` overrides the document title and `preheader` sets the preview text (empty clears; a full html document ignores it); `json` carries both inside the tree. Changing `alias` breaks sends and automations that reference the old one. 409 `template_exists` when the alias is taken.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PatchTemplate" } } } }
      responses:
        "200": { description: updated }
  /v1/templates/{id}/versions:
    get:
      operationId: template_versions
      summary: Version history, newest first (scope read). `published` marks the live version.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "[{version, source_format, created_at, published_at, published}]" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/templates/{id}/versions/{version}:
    get:
      operationId: template_version_get
      summary: One version with its block tree (scope read)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{id, alias, version, subject, preheader, created_at, published_at, published, source_format, source, template}" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/templates/{id}/versions/{version}/restore:
    post:
      operationId: template_version_restore
      summary: Copy an older version into a new draft (scope manage). History is kept; publish the new draft to go live.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "201": { description: "{id, alias, version, restored_from, published_version}" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/templates/{id}/draft:
    delete:
      operationId: template_discard_draft
      summary: Discard unpublished changes (scope manage). Deletes the never-published versions newer than the published one; 409 `no_draft` / `no_published_version`.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: "{id, alias, discarded, version, published_version}" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/templates/{id}/publish:
    post:
      operationId: template_publish
      summary: Make a version (default newest) the one sends use (scope manage). Body optional `{version}`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: published }
        "422": { $ref: "#/components/responses/Error" }
  /v1/templates/{id}/preview:
    post:
      operationId: template_preview
      summary: Render with sample data merged with `variables` (scope read). Undefined variable -> 422 `template_render_failed`.
      description: Renders a saved `version` (default newest). Give `html`, `mjml` or `content` (+`format`) to render unsaved content instead - nothing is stored. Also returns the `variables` the content reads and import `warnings`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { variables: { type: object }, version: { type: integer }, html: { type: string }, mjml: { type: string }, content: {}, format: { type: string, enum: [json, mjml, html] }, subject: { type: string }, preheader: { type: string } } } } } }
      responses:
        "200": { description: preview, content: { application/json: { schema: { $ref: "#/components/schemas/TemplatePreview" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/templates/{id}/export:
    get:
      operationId: template_export
      summary: Export as html, mjml or canonical json (scope read)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: format, in: query, schema: { type: string, enum: [html, mjml, json], default: html } }
        - { name: version, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{format, content}" }
  /v1/content/lint:
    post:
      operationId: content_lint
      summary: Lint html / mjml / template json without saving it (scope read)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { html: { type: string }, mjml: { type: string }, content: {}, format: { type: string, enum: [html, mjml, json] }, subject: { type: string }, stream: { type: string, enum: [transactional, marketing] }, variables: { type: object } } } } } }
      responses:
        "200": { description: lint issues, content: { application/json: { schema: { type: object, properties: { lint: { type: array, items: { $ref: "#/components/schemas/LintIssue" } }, warnings: { type: array, items: { type: string } } } } } } }
  /v1/automations:
    post:
      operationId: automation_create
      summary: Install (validate and store) an automation as a new version (scope manage)
      description: Body is a `Definition` (`steps[]` begins with a `trigger` step); a top-level `trigger` (event name or trigger config) is accepted and becomes that step. A `send_email` step's `config.template` is a published template's alias or id; its `config.from` routes like `POST /v1/emails` (a connected mailbox address goes through that mailbox, with its display name) and `config.transport_id` forces a transport. A new name creates a `draft`. An existing name (names are the key, so this is also how you edit) stores version N+1 and leaves the status alone; if it is `active`, new entries run the new version at once while runs already in flight finish on their own version.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AutomationDefinition" } } } }
      responses:
        "201": { description: installed, content: { application/json: { schema: { $ref: "#/components/schemas/Automation" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      operationId: automation_list
      summary: List automations (scope read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, paused, archived] }, description: "archived automations are hidden unless asked for" }
      responses:
        "200": { description: page of automations }
  /v1/automations/{id}:
    get:
      operationId: automation_get
      summary: Automation with its current steps; `id` is a uuid or name (scope read)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: automation, content: { application/json: { schema: { $ref: "#/components/schemas/Automation" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/automations/{id}/publish:
    post:
      operationId: automation_publish
      summary: Activate. Optional `{backfill_suppress}` keeps existing matches from entering (scope manage).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: active }
  /v1/automations/{id}/pause:
    post:
      operationId: automation_pause
      summary: Pause an active automation (409 `invalid_state` otherwise; scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: paused }
        "409": { $ref: "#/components/responses/Error" }
  /v1/automations/{id}/resume:
    post:
      operationId: automation_resume
      summary: Resume a paused automation (409 `invalid_state` otherwise; scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: active }
        "409": { $ref: "#/components/responses/Error" }
  /v1/automations/{id}/archive:
    post:
      operationId: automation_archive
      summary: Archive a draft or paused automation (409 `invalid_state` otherwise; scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: archived }
        "409": { $ref: "#/components/responses/Error" }
  /v1/automations/{id}/unarchive:
    post:
      operationId: automation_unarchive
      summary: Bring an archived automation back as a draft (409 `invalid_state` otherwise; scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: draft }
        "409": { $ref: "#/components/responses/Error" }
  /v1/automations/{id}/test:
    post:
      operationId: automation_test_run
      summary: Start a run for one contact now, whatever the status, skipping the entry rule (scope send or manage)
      description: The contact is created if new. A test key keeps every email in the sandbox (nothing is delivered); a live key sends for real once the workspace is live, and the kill switch, suppressions, topic opt-outs and the approval policy still apply. The worker advances the run within about a second; poll `GET /v1/automations/{id}/runs/{run}`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], additionalProperties: false, properties: { email: { type: string, format: email }, first_name: { type: string }, properties: { type: object, description: "properties of the simulated trigger event" }, contact_properties: { type: object } } } } } }
      responses:
        "202": { description: "{run_id, automation_id, contact_id, env, status}" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/automations/{id}/runs/{run}:
    get:
      operationId: automation_run_get
      summary: One run with its step log (scope read)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: run, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "run (state, current_step, next_wake_at, exit_reason, test) and steps[{step_key, result, at}]" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/events/names:
    get:
      operationId: event_names
      summary: Event names tracked in the last 90 days with counts, newest first (scope read)
      responses:
        "200": { description: "[{name, count, last_seen_at}]" }
  /v1/automations/{id}/runs:
    get:
      operationId: automation_runs
      summary: Runs, newest first; each carries contact_email, exit_reason and `test` (scope read)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: status, in: query, schema: { type: string, enum: [active, waiting, completed, exited, failed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: page of runs }
  /v1/domains/{id}/dkim/activate:
    post:
      operationId: domain_dkim_activate
      summary: Switch signing to a standby selector created by rotate-dkim (scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [selector], properties: { selector: { type: string } } } } } }
      responses:
        "200": { description: keys }
        "404": { $ref: "#/components/responses/Error" }
  /v1/domains/{id}/dkim/purge:
    post:
      operationId: domain_dkim_purge
      summary: Delete retired DKIM keys older than 7 days and their records (scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "{purged: [selector]}" }
  /v1/domains/{id}/dns/sync:
    post:
      operationId: domain_dns_sync
      summary: Write the plan's records to Cloudflare; `dry_run` only reports changes (scope manage)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [provider], properties: { provider: { type: string, enum: [cloudflare] }, dry_run: { type: boolean, default: false }, api_token: { type: string, description: "write-only; falls back to CLOUDFLARE_API_TOKEN" } } } } } }
      responses:
        "200": { description: changes }
        "502": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "mc_test_... or mc_live_... key" }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 256 } }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    SetupRequest: { type: object, additionalProperties: false, properties: { admin_email: { type: string, format: email } } }
    SetupResult: { type: object, properties: { workspace_id: { type: string, format: uuid }, admin_key: { type: string }, test_key: { type: string } } }
    DoctorResult:
      type: object
      properties:
        checks:
          type: array
          items: { type: object, required: [id, status, detail, hint], properties: { id: { type: string }, status: { type: string, enum: [pass, fail, warn, skipped] }, detail: { type: string }, hint: { type: string } } }
    StatsOverview:
      type: object
      properties:
        totals: { type: object, properties: { sent: { type: integer }, delivered: { type: integer }, bounced: { type: integer }, complained: { type: integer }, deferred: { type: integer } } }
        series: { type: array, items: { type: object, properties: { date: { type: string, format: date }, sent: { type: integer }, delivered: { type: integer }, bounced: { type: integer }, complained: { type: integer } } } }
    DeliveryPath: { type: object, properties: { kind: { type: string, enum: [sandbox, gmail-oauth, smtp-relay, ses, direct] }, detail: { type: string } } }
    Settings:
      type: object
      properties:
        llm_provider: { type: object, properties: { kind: { type: string, enum: [openrouter, openai, ollama] }, model: { type: [string, "null"] }, base_url: { type: [string, "null"] }, api_key_set: { type: boolean } } }
        delivery_path: { $ref: "#/components/schemas/DeliveryPath" }
        default_from: { type: [string, "null"], description: "the default From address, picked from GET /v1/senders" }
        reply_to: { type: [string, "null"] }
        custom_instructions: { type: [string, "null"], maxLength: 2000, description: Workspace writing instructions for LLM emails }
    SettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        llm_provider: { type: object, additionalProperties: false, properties: { kind: { type: string }, model: { type: string }, base_url: { type: string }, api_key: { type: string, description: write-only } } }
        default_from: { type: string }
        reply_to: { type: string }
        custom_instructions: { type: string, maxLength: 2000, description: "Trimmed; empty string clears; over 2000 chars is 422 custom_instructions_too_long. Cannot override safety rules." }
    PolicyView:
      type: object
      properties:
        default: { $ref: "#/components/schemas/KeyPolicy" }
        keys: { type: array, items: { type: object, properties: { key_id: { type: string, format: uuid }, name: { type: string }, policy: { $ref: "#/components/schemas/KeyPolicy" } } } }
    EventDefinition: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string, maxLength: 128 }, schema: { type: object }, description: { type: string } } }
    CreateTransport:
      type: object
      required: [kind, config]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [smtp-relay, ses] }
        preset: { type: string, enum: [postmark, mailgun, resend, brevo, smtp2go, ses] }
        name: { type: string }
        label: { type: string, enum: [test, low-volume, production] }
        daily_cap: { type: integer, minimum: 1 }
        is_default: { type: boolean }
        config: { type: object, description: write-only credentials, see the operation description }
    Transport:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        name: { type: string }
        label: { type: string }
        is_default: { type: boolean }
        daily_cap: { type: [integer, "null"] }
        status: { type: string }
        from: { type: [string, "null"], description: gmail-oauth only }
        detail: { type: object, description: "non-secret facts, e.g. host/port/region" }
        created_at: { type: string, format: date-time }
    CreateTemplate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        alias: { type: string, description: defaults to a slug of name }
        stream: { type: string, enum: [transactional, marketing] }
        subject: { type: string }
        html: { type: string }
        mjml: { type: string }
        content: { description: "string, or an object for format json" }
        format: { type: string, enum: [json, mjml, html] }
        text: { type: string, description: accepted, generated instead }
        variables: { type: array, items: { type: string }, description: accepted, derived instead }
    ImportTemplate:
      type: object
      required: [format, name, content]
      additionalProperties: false
      properties:
        format: { type: string, enum: [html, mjml, json] }
        name: { type: string }
        content: { description: string, or an object for json }
        alias: { type: string }
        stream: { type: string, enum: [transactional, marketing] }
        subject: { type: string }
    PatchTemplate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        alias: { type: string, description: "sends and automations reference the alias; changing it breaks them" }
        stream: { type: string, enum: [transactional, marketing] }
        html: { type: string }
        mjml: { type: string }
        content: {}
        format: { type: string, enum: [json, mjml, html] }
        subject: { type: string }
        preheader: { type: string, description: "empty clears it; full-document html ignores it" }
        text: { type: string }
        variables: { type: array, items: { type: string } }
    Template:
      type: object
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        name: { type: string }
        subject: { type: string }
        status: { type: string, enum: [draft, published] }
        version: { type: integer }
        published_version: { type: [integer, "null"] }
        warnings: { type: array, items: { type: string } }
    LintIssue: { type: object, properties: { rule: { type: string }, severity: { type: string, enum: [error, warning] }, message: { type: string }, path: { type: string } } }
    TemplatePreview:
      type: object
      properties:
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        lint: { type: array, items: { $ref: "#/components/schemas/LintIssue" } }
        variables: { type: array, items: { type: string }, description: merge fields the content reads }
        warnings: { type: array, items: { type: string } }
    AutomationDefinition:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        trigger: { description: "event name or trigger config; becomes the first step" }
        entry_rule: { type: string, enum: [once, always, after_days, if_no_active_run] }
        entry_days: { type: integer }
        goal: { type: object }
        approval: { type: string, description: "always | never | first_n:N" }
        caps: { type: object }
        steps: { type: array, items: { type: object, required: [key, type], properties: { key: { type: string }, type: { type: string, enum: [trigger, condition, delay, wait_for_event, send_email, update_contact, add_to_segment, exit] }, config: { type: object }, next: {} } } }
    Automation:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, active, paused, archived] }
        trigger: { type: string }
        version: { type: integer }
        steps: { type: array, items: { type: object } }
        stats:
          type: object
          description: Per step key, over all runs. completed = entered minus active, exited and failed.
          additionalProperties:
            type: object
            properties: { entered: { type: integer }, completed: { type: integer }, failed: { type: integer }, active: { type: integer }, exited: { type: integer } }
    KeyPolicy:
      type: object
      description: action -> decision
      properties:
        send: { type: string, enum: [auto, needs_approval, blocked] }
      additionalProperties: false
    CreateKey:
      type: object
      required: [name, env, scopes]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        env: { type: string, enum: [test, live] }
        scopes: { type: array, items: { type: string, enum: [read, send, manage] }, minItems: 1 }
        domain_id: { type: string, format: uuid }
        policy: { $ref: "#/components/schemas/KeyPolicy" }
        recipient_allowlist: { type: array, items: { type: string }, description: "exact addresses or @domain entries; test keys may also use magic addresses" }
        daily_send_cap: { type: integer, minimum: 1 }
        minute_send_cap: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
    Sender:
      type: object
      properties:
        address: { type: string }
        display_name: { type: [string, "null"] }
        kind: { type: string, enum: [login, alias, domain] }
        transport_id: { type: [string, "null"], format: uuid }
        transport: { type: [string, "null"], description: transport name }
        is_default: { type: boolean }
        status: { type: string, enum: [ready, needs_domain, transport_missing] }
    SendEmail:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        from: { type: string, description: "required for live keys; an address on a verified domain or a connected mailbox (login or alias). A bare connected address gets its display name." }
        transport_id: { type: string, format: uuid, description: "send through this transport. Otherwise the transport is chosen by `from`: a mailbox relay with that login or alias, then the transport bound to the domain (`PATCH /v1/domains/{id}`), then the workspace default. The choice is recorded in `policy_decisions` (rule `routing`)." }
        to: { type: array, items: { type: string, format: email }, minItems: 1, maxItems: 50 }
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        reply_to: { type: string }
        template: { type: object, required: [id], properties: { id: { type: string, description: "alias or uuid" }, variables: { type: object } } }
        stream: { type: string, enum: [transactional, marketing], default: transactional }
        tags: { type: array, items: { type: object } }
        headers: { type: object, additionalProperties: { type: string }, description: "custom headers; platform-owned headers are rejected" }
        scheduled_at: { type: string, format: date-time }
        dry_run: { type: boolean, default: false }
    SendResult:
      type: object
      properties:
        id: { type: string, format: uuid, description: "first recipient's email id" }
        status: { type: string, enum: [queued, pending_approval] }
        stream: { type: string }
        approval_id: { type: string, format: uuid }
        policy_decisions: { type: array, items: { type: object } }
        recipients: { type: array, items: { type: object, properties: { email: { type: string }, id: { type: string, format: uuid } } } }
    BroadcastRecipient:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        data: { type: object, description: "extra columns, usable as {{ data.<column> }}; keys are letters, digits and _, values are text, numbers or booleans" }
    CreateBroadcast:
      type: object
      required: [template_id, from, recipients]
      additionalProperties: false
      properties:
        template_id: { type: string, description: id or alias }
        from: { type: string }
        subject: { type: string, description: replaces the template subject; may use the same variables }
        stream: { type: string, enum: [transactional, marketing], default: marketing }
        recipients: { type: array, minItems: 1, maxItems: 5000, items: { $ref: "#/components/schemas/BroadcastRecipient" } }
        max_per_day: { type: integer, minimum: 1, description: "upper bound on sends per day; the lowest of this and the transport / key caps applies" }
        transport_id: { type: string, format: uuid, description: "send through this transport; see SendEmail" }
        dry_run: { type: boolean, default: false }
    BroadcastResult:
      type: object
      properties:
        id: { type: string, format: uuid, description: absent on dry runs }
        status: { type: string, enum: [queued, pending_approval] }
        queued: { type: integer }
        skipped: { type: array, items: { type: object, properties: { email: { type: string }, reason: { type: string }, detail: { type: [string, "null"] } } } }
        approval_id: { type: string, format: uuid }
        schedule:
          type: object
          properties:
            daily_cap: { type: [integer, "null"], description: effective sends per day; null = unpaced }
            transport_daily_cap: { type: [integer, "null"] }
            spacing_seconds: { type: number }
            first_at: { type: string, format: date-time }
            last_at: { type: string, format: date-time }
    Broadcast:
      type: object
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        template_name: { type: string }
        from: { type: string }
        subject: { type: string, description: "override; empty = the template's subject" }
        stream: { type: string }
        env: { type: string, enum: [test, live] }
        status: { type: string, enum: [pending_approval, sending, done] }
        total: { type: integer, description: rows queued }
        created_at: { type: string, format: date-time }
        counts: { type: object, properties: { queued: { type: integer }, sent: { type: integer }, delivered: { type: integer }, bounced: { type: integer }, failed: { type: integer }, skipped: { type: integer } } }
        first_at: { type: [string, "null"], format: date-time }
        last_at: { type: [string, "null"], format: date-time }
    BroadcastDetail:
      allOf:
        - { $ref: "#/components/schemas/Broadcast" }
        - type: object
          properties:
            skipped: { type: array, items: { type: object } }
            recipients: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, email: { type: string }, status: { type: string }, last_error: { type: [string, "null"] }, scheduled_at: { type: [string, "null"] }, sent_at: { type: [string, "null"] } } } }
            next_cursor: { type: [string, "null"] }
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, const: false }
        request_id: { type: string }
        error:
          type: object
          required: [code, message, doc_url, retryable]
          properties:
            code:
              type: string
              description: |
                Stable. invalid_request, unauthenticated, forbidden_scope, not_found, idempotency_key_reused,
                rate_limited, domain_not_verified, recipient_suppressed, recipient_not_allowed, blocked_by_policy,
                send_cap_exceeded, kill_switch_active, test_key_live_recipient, approval_already_decided,
                no_deliverable_recipients, template_render_failed,
                invalid_state, not_implemented, internal_error
            message: { type: string }
            field: { type: string }
            hint: { type: string }
            doc_url: { type: string }
            retryable: { type: boolean }
