name: quickstart
# Runs the README quickstart end to end with docker compose. Every push to main; on PRs only
# when the quickstart's inputs change.
on:
  push: { branches: [main] }
  pull_request:
    paths:
      - README.md
      - docs/QUICKSTART.md
      - scripts/quickstart-check.sh
      - Dockerfile
      - dashboard/Dockerfile
      - docker-compose*.yml
      - migrations/**
      - crates/mailcraft-cli/**
      - .github/workflows/quickstart.yml
permissions: { contents: read }
jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # only used when the README has no compose cli service; version from rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/quickstart-check.sh
