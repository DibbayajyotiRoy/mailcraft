name: quickstart
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # only used when the README has no compose cli service; version from rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/quickstart-check.sh
