name: docker
# The self-host path (docker compose + the images). Runs on every push to main, and on PRs
# only when something that shapes the images or the compose file changes.
on:
  push: { branches: [main] }
  pull_request:
    paths:
      - Dockerfile
      - dashboard/Dockerfile
      - .dockerignore
      - dashboard/.dockerignore
      - docker-compose*.yml
      - rust-toolchain.toml
      - .github/workflows/docker.yml
permissions: { contents: read }
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: MAILCRAFT_SECRET_KEY=ci docker compose config -q
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: dashboard, push: false, cache-from: "type=gha,scope=dashboard", cache-to: "type=gha,mode=max,scope=dashboard" }
