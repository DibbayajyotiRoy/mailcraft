# echo "MAILCRAFT_SECRET_KEY=$(openssl rand -base64 32)" > .env && docker compose up -d
# API http://localhost:8080  dashboard http://localhost:3000 (MAILCRAFT_PORT / MAILCRAFT_DASHBOARD_PORT change them)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mailcraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailcraft}
      POSTGRES_DB: mailcraft
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailcraft"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

  mailcraft:
    build: .
    image: ghcr.io/dibbayajyotiroy/mailcraft:latest
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://mailcraft:${POSTGRES_PASSWORD:-mailcraft}@postgres:5432/mailcraft
      REDIS_URL: redis://redis:6379
      MAILCRAFT_SECRET_KEY: ${MAILCRAFT_SECRET_KEY:?set MAILCRAFT_SECRET_KEY (openssl rand -base64 32)}
      MAILCRAFT_BIND: 0.0.0.0:8080
      # Recipient-reachable URL: unsubscribe links and the instance DNS domain are built from it.
      MAILCRAFT_PUBLIC_URL: ${MAILCRAFT_PUBLIC_URL:-http://localhost:8080}
      # `domain add` needs your sending IP(s) for the return-path SPF (or a public URL with a real host).
      MAILCRAFT_EGRESS_IP: ${MAILCRAFT_EGRESS_IP:-}
      MAILCRAFT_MX_HOST: ${MAILCRAFT_MX_HOST:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MAILCRAFT_LLM_MODEL: ${MAILCRAFT_LLM_MODEL:-}
      MAILCRAFT_LLM_REASONING: ${MAILCRAFT_LLM_REASONING:-}
      MAILCRAFT_LLM_FALLBACK_MODELS: ${MAILCRAFT_LLM_FALLBACK_MODELS:-}
      MAILCRAFT_LLM_GUARDRAILS: ${MAILCRAFT_LLM_GUARDRAILS:-}
      MAILCRAFT_GOOGLE_CLIENT_ID: ${MAILCRAFT_GOOGLE_CLIENT_ID:-}
      MAILCRAFT_GOOGLE_CLIENT_SECRET: ${MAILCRAFT_GOOGLE_CLIENT_SECRET:-}
    ports: ["${MAILCRAFT_PORT:-8080}:8080"]
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      MAILCRAFT_API_URL: http://mailcraft:8080
    ports: ["${MAILCRAFT_DASHBOARD_PORT:-3000}:3000"]
    depends_on: [mailcraft]
    restart: unless-stopped

  # The CLI, no install needed: `docker compose run --rm cli init` (any subcommand works).
  # Keys live in the named volume, so they survive --rm. Runs as root so the fresh volume is writable.
  cli:
    image: ghcr.io/dibbayajyotiroy/mailcraft:latest
    profiles: [cli]
    entrypoint: ["/usr/local/bin/mailcraft"]
    user: "0"
    environment:
      MAILCRAFT_API_URL: http://mailcraft:8080
      MAILCRAFT_CONFIG_DIR: /config
      MAILCRAFT_EGRESS_IP: ${MAILCRAFT_EGRESS_IP:-}
    volumes: [mc-config:/config]
    depends_on: [mailcraft]

volumes:
  pgdata:
  mc-config:
